services:
  backend:
    image: ${IMAGE:-registry.gitlab.com/eric-group2600910/zhao_plateforme2026-project/backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - "${STORAGE_ROOT_PATH:-/data/storage}:/data/storage"
