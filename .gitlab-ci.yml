stages:
  - verify
  - build
  - deploy

variables:
  IMAGE: registry.gitlab.com/eric-group2600910/zhao_plateforme2026-project/backend
  BACKEND_SERVICE: backend
  DEPLOY_PATH: /opt/ZHAO_Plateforme2026-project
  DEPLOY_COMPOSE_FILE: docker-compose.prod.yml
  LEGACY_BACKEND_CONTAINER: webapp2026-api

default:
  cache:
    - key:
        files:
          - package-lock.json
      paths:
        - node_modules/
    - key:
        files:
          - backend/package-lock.json
      paths:
        - backend/node_modules/
    - key:
        files:
          - frontend/package-lock.json
      paths:
        - frontend/node_modules/

verify:
  stage: verify
  image: node:20
  script:
    - npm ci
    - npm --prefix backend ci
    - npm --prefix frontend ci
    - npm run verify

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --pull -t "$IMAGE:$CI_COMMIT_SHA" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_SHA"
    - docker push "$IMAGE:latest"

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
  script:
    - 'test -n "$SERVER_IP" || (echo "Missing CI variable: SERVER_IP" && exit 1)'
    - 'test -n "$SSH_PRIVATE_KEY" || (echo "Missing CI variable: SSH_PRIVATE_KEY" && exit 1)'
    - 'test -n "$ADMIN_EMAILS" || (echo "Missing CI variable: ADMIN_EMAILS" && exit 1)'
    - 'test -n "$ADMIN_DEFAULT_PASSWORD" || (echo "Missing CI variable: ADMIN_DEFAULT_PASSWORD" && exit 1)'
    - |
      ssh -o StrictHostKeyChecking=no ubuntu@"$SERVER_IP" \
        "DEPLOY_PATH='$DEPLOY_PATH' \
         DEPLOY_COMPOSE_FILE='$DEPLOY_COMPOSE_FILE' \
         BACKEND_SERVICE='$BACKEND_SERVICE' \
         IMAGE='$IMAGE' \
         IMAGE_TAG='$CI_COMMIT_SHA' \
         ADMIN_EMAILS='$ADMIN_EMAILS' \
         ADMIN_DEFAULT_PASSWORD='$ADMIN_DEFAULT_PASSWORD' \
         SEED_DEMO_USERS='${SEED_DEMO_USERS:-false}' \
         sh -s" <<'EOSSH'
        set -euo pipefail
        cd "$DEPLOY_PATH"

        if [ ! -f "$DEPLOY_COMPOSE_FILE" ]; then
          echo "Compose file not found: $DEPLOY_COMPOSE_FILE"
          pwd
          ls -la
          exit 1
        fi

        if [ ! -f ".env.production" ]; then
          echo "Missing deployment env file: .env.production"
          exit 1
        fi

        services="$(docker compose -f "$DEPLOY_COMPOSE_FILE" config --services)"
        if ! printf '%s\n' "$services" | grep -qx "$BACKEND_SERVICE"; then
          if printf '%s\n' "$services" | grep -qx "backend"; then
            echo "Compose service not found: $BACKEND_SERVICE, fallback to backend"
            BACKEND_SERVICE="backend"
          else
            echo "Compose service not found: $BACKEND_SERVICE"
            echo "Available services:"
            printf '%s\n' "$services"
            exit 1
          fi
        fi

        export IMAGE IMAGE_TAG ADMIN_EMAILS ADMIN_DEFAULT_PASSWORD SEED_DEMO_USERS
        if docker ps -a --format '{{.Names}}' | grep -qx "$LEGACY_BACKEND_CONTAINER"; then
          echo "Removing legacy backend container: $LEGACY_BACKEND_CONTAINER"
          docker rm -f "$LEGACY_BACKEND_CONTAINER"
        fi

        host_backend_port="${BACKEND_PORT:-3000}"
        port_holders="$(docker ps --format '{{.Names}} {{.Ports}}' | awk -v port="$host_backend_port" '
          index($0, "0.0.0.0:" port "->") || index($0, ":::" port "->") { print $1 }
        ')"
        if [ -n "$port_holders" ]; then
          echo "Host port $host_backend_port currently used by:"
          printf '%s\n' "$port_holders"
        fi

        used_repo_image_ids="$(
          docker ps -a --format '{{.Image}}' \
            | awk -v image="$IMAGE" 'index($0, image ":") == 1 { print $0 }' \
            | xargs -r docker image inspect --format '{{.Id}}' 2>/dev/null \
            | sort -u
        )"
        repo_image_ids="$(docker images "$IMAGE" --format '{{.ID}}' | sort -u)"
        if [ -n "$repo_image_ids" ]; then
          printf '%s\n' "$repo_image_ids" | while IFS= read -r image_id; do
            [ -n "$image_id" ] || continue
            if printf '%s\n' "$used_repo_image_ids" | grep -qx "$image_id"; then
              continue
            fi
            docker rmi "$image_id" >/dev/null 2>&1 || true
          done
        fi
        docker image prune -f >/dev/null 2>&1 || true

        docker compose -f "$DEPLOY_COMPOSE_FILE" pull "$BACKEND_SERVICE"
        docker compose -f "$DEPLOY_COMPOSE_FILE" run --rm "$BACKEND_SERVICE" node scripts/recover-return-photo-migration.js
        docker compose -f "$DEPLOY_COMPOSE_FILE" run --rm "$BACKEND_SERVICE" node scripts/recover-product-category-migration.js
        docker compose -f "$DEPLOY_COMPOSE_FILE" run --rm "$BACKEND_SERVICE" npm run prisma:migrate:deploy
        docker compose -f "$DEPLOY_COMPOSE_FILE" run --rm "$BACKEND_SERVICE" npm run prisma:seed
        docker compose -f "$DEPLOY_COMPOSE_FILE" up -d "$BACKEND_SERVICE"
      EOSSH
  only:
    - main
