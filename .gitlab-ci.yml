stages:
  - build
  - deploy

variables:
  IMAGE: registry.gitlab.com/eric-group2600910/zhao_plateforme2026-project/backend

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE:latest" .
    - docker push "$IMAGE:latest"

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
  script:
    - test -n "$ADMIN_EMAILS" || (echo "Missing CI variable: ADMIN_EMAILS" && exit 1)
    - test -n "$ADMIN_DEFAULT_PASSWORD" || (echo "Missing CI variable: ADMIN_DEFAULT_PASSWORD" && exit 1)
    - |
      ssh -o StrictHostKeyChecking=no ubuntu@$SERVER_IP "
        set -e
        cd /opt/ZHAO_Plateforme2026-project
        docker compose pull
        docker compose run --rm backend npm run prisma:migrate:deploy
        docker compose run --rm \
          -e ADMIN_EMAILS='${ADMIN_EMAILS}' \
          -e ADMIN_DEFAULT_PASSWORD='${ADMIN_DEFAULT_PASSWORD}' \
          -e SEED_DEMO_USERS='${SEED_DEMO_USERS:-false}' \
          backend npm run prisma:seed
        docker compose up -d
      "
  only:
    - main
